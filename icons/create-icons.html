<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .icon-preview { border: 1px solid #ccc; margin: 10px; display: inline-block; }
        canvas { background: #2196f3; }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>This page generates PWA icons for the Arabic Vocabulary Trainer.</p>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        sizes.forEach(size => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#2196f3';
            ctx.fillRect(0, 0, size, size);
            
            // Arabic text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('م', size/2, size/2);
            
            const div = document.createElement('div');
            div.className = 'icon-preview';
            div.innerHTML = `<h3>${size}x${size}</h3>`;
            div.appendChild(canvas);
            
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.textContent = 'Download PNG';
            div.appendChild(document.createElement('br'));
            div.appendChild(link);
            
            document.body.appendChild(div);
        });
    </script>
</body>
</html>
