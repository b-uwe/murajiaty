<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <rect width="192" height="192" fill="#006633" rx="32"/>
  
  <!-- Back cards (stack effect) -->
  <rect x="20" y="55" width="140" height="90" fill="white" rx="16" transform="rotate(-6 90 100)" stroke="#ddd" stroke-width="1"/>
  <rect x="25" y="50" width="140" height="90" fill="#f8f9fa" rx="16" transform="rotate(-3 95 95)" stroke="#ddd" stroke-width="1"/>
  
  <!-- Front card -->
  <rect x="30" y="45" width="140" height="90" fill="white" rx="16" stroke="#ccc" stroke-width="1"/>
  
  <!-- Card content: مراجعتي -->
  <text x="100" y="100" font-family="Tahoma, Arial, sans-serif" font-size="32" font-weight="600" fill="#006633" text-anchor="middle" direction="rtl">مراجعتي</text>
  
  <!-- BUCKET OPTION 2: Progress bar showing learning progress -->
  <rect x="50" y="115" width="100" height="6" fill="#e0e0e0" rx="3"/>
  <rect x="50" y="115" width="60" height="6" fill="#66cc66" rx="3"/>
  
  <!-- Folded corner -->
  <rect x="145" y="30" width="40" height="40" fill="white" rx="16" stroke="#bbb" stroke-width="1.5"/>
  <rect x="151" y="4" width="50" height="50" fill="#006633" transform="rotate(45 163 32)"/>
  
</svg>